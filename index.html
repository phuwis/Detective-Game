<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>คดีปริศนาออนไลน์</title>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <style>
      body {
        font-family: sans-serif;
        background-color: #1a1a1a;
        color: #fff;
        text-align: center;
        padding: 20px;
      }
      .container {
        max-width: 500px;
        margin: 0 auto;
        background: #2d2d2d;
        padding: 25px;
        border-radius: 12px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
      }
      input,
      button {
        width: 90%;
        padding: 12px;
        margin: 10px 0;
        border-radius: 6px;
        border: none;
        font-size: 16px;
      }
      input {
        background: #444;
        color: #fff;
      }
      button {
        background: #ff4d4d;
        color: white;
        cursor: pointer;
        font-weight: bold;
      }
      button:hover {
        background: #cc3333;
      }
      .hidden {
        display: none;
      }
      .box {
        background: #3d3d3d;
        padding: 15px;
        border-radius: 8px;
        margin: 15px 0;
        border-left: 5px solid #ff4d4d;
      }
      .phase-box {
        background: #1f3a52;
        border-left: 5px solid #007bff;
        padding: 15px;
        border-radius: 8px;
        margin: 15px 0;
        font-weight: bold;
      }
      .player-tag {
        display: inline-block;
        background: #555;
        padding: 8px 12px;
        margin: 5px;
        border-radius: 20px;
        font-weight: bold;
      }
      .clickable {
        cursor: pointer;
        background: #e67e22;
      }
      .clickable:hover {
        background: #d35400;
      }
      #logs {
        max-height: 120px;
        overflow-y: auto;
        background: #222;
        padding: 10px;
        font-size: 14px;
        text-align: left;
        border-radius: 5px;
        border: 1px solid #444;
      }
      .btn-next {
        background: #2ecc71;
      }
      .btn-next:hover {
        background: #27ae60;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>🕵️‍♂️ คดีปริศนาออนไลน์</h1>
      <hr style="border-color: #444" />

      <div id="login-screen">
        <input type="text" id="username" placeholder="ใส่ชื่อของคุณ" />
        <input type="text" id="room-id" placeholder="รหัสห้อง (เช่น room123)" />
        <button onclick="joinRoom()">เข้าห้องเกม</button>
      </div>

      <div id="lobby-screen" class="hidden">
        <h2>ห้อง: <span id="display-room"></span></h2>
        <h3>ผู้เล่นในห้องปัจจุบัน:</h3>
        <div id="player-list"></div>
        <br />
        <button id="start-btn" onclick="startGame()">
          เริ่มแจกบทบาทและเริ่มเฟส 1
        </button>
      </div>

      <div id="game-screen" class="hidden">
        <div id="phase-display" class="phase-box"></div>

        <div class="box">
          <h2 id="my-role" style="color: #ff4d4d">กำลังรับบทบาท...</h2>
          <p id="my-clue"></p>
        </div>

        <div
          id="evidence-box"
          class="box hidden"
          style="border-left-color: #f1c40f; background: #4a3c00"
        >
          <h3 style="color: #f1c40f; margin: 0 0 5px 0">
            🔍 พบหลักฐานชิ้นสำคัญกลาง:
          </h3>
          <p
            id="evidence-text"
            style="margin: 0; font-size: 16px; font-weight: bold"
          ></p>
        </div>

        <h3>👥 รายชื่อบุคคลในบ้านหลังนี้</h3>
        <div id="voting-list"></div>

        <button
          id="next-phase-btn"
          class="btn-next hidden"
          onclick="nextPhase()"
        >
          ถัดไป: เข้าสู่เฟส 2 ➡️
        </button>

        <h4 style="margin-top: 20px">📜 บันทึกเหตุการณ์ในห้องสอบสวน:</h4>
        <div id="logs"></div>
      </div>
    </div>

    <script>
      const socket = io();
      let myName = "";
      let myRoom = "";
      let myRole = "";
      let currentPhase = 1;
      let currentPlayersInRoom = [];

      function joinRoom() {
        const inputName = document.getElementById("username").value.trim();
        const inputRoom = document.getElementById("room-id").value.trim();
        if (!inputName || !inputRoom)
          return alert("กรุณากรอกข้อมูลให้ครบถ้วนครับ");
        myName = inputName;
        myRoom = inputRoom;
        socket.emit("joinRoom", { name: myName, room: myRoom });
        document.getElementById("login-screen").classList.add("hidden");
        document.getElementById("lobby-screen").classList.remove("hidden");
        document.getElementById("display-room").innerText = myRoom;
      }

      socket.on("roomData", ({ players, started }) => {
        currentPlayersInRoom = players;
        document.getElementById("player-list").innerHTML = players
          .map((p) => `• ${p}`)
          .join("<br>");
        renderGameUI();
      });

      function startGame() {
        socket.emit("startGame", myRoom);
      }
      function nextPhase() {
        socket.emit("nextPhase", myRoom);
      }
      function vote(targetName) {
        socket.emit("votePlayer", { room: myRoom, targetName: targetName });
      }

      socket.on("errorMsg", (msg) => alert(msg));
      socket.on("gameStarted", () => {
        document.getElementById("lobby-screen").classList.add("hidden");
        document.getElementById("game-screen").classList.remove("hidden");
      });

      socket.on("receiveRole", ({ role, clue }) => {
        myRole = role;
        document.getElementById("my-role").innerText = role;
        document.getElementById("my-clue").innerText = clue;
        if (myRole === "🔵 นักสืบ (Detective)") {
          document.getElementById("next-phase-btn").classList.remove("hidden");
        }
      });

      // รับข้อมูลอัปเดตเมื่อมีการเปลี่ยนเฟสเกม
      socket.on("phaseChanged", ({ phase, evidence }) => {
        currentPhase = phase;
        const phaseDisplay = document.getElementById("phase-display");
        const nextBtn = document.getElementById("next-phase-btn");
        const evidenceBox = document.getElementById("evidence-box");

        if (phase === 1) {
          phaseDisplay.innerHTML =
            "💬 Phase 1: ช่วงสอบสวนพยาน<br><span style='font-size:13px; font-weight:normal;'>นักสืบจะสุ่มพูดคุยกับพยาน พยานต้องทำการ Roleplay ตามเรื่องราวตัวเอง</span>";
          if (myRole === "🔵 นักสืบ (Detective)") {
            nextBtn.innerText = "ถัดไป: ไปยังเฟส 2 (เปิดหลักฐานกลาง) ➡️";
            nextBtn.classList.remove("hidden");
          }
        } else if (phase === 2) {
          phaseDisplay.innerHTML =
            "🔍 Phase 2: ตรวจสอบหลักฐานชิ้นสำคัญ<br><span style='font-size:13px; font-weight:normal;'>ทุกคนมีเอี่ยวกับหลักฐานนี้! นักสืบจะเริ่มเค้นความจริงตามหลักฐานที่ปรากฏ</span>";
          evidenceBox.classList.remove("hidden");
          document.getElementById("evidence-text").innerText = evidence;
          if (myRole === "🔵 นักสืb (Detective)") {
            nextBtn.innerText = "ถัดไป: ไปยังเฟส 3 (ชี้ตัวคนร้าย!) ➡️";
            nextBtn.classList.remove("hidden");
          } else {
            nextBtn.classList.add("hidden");
          }
        } else if (phase === 3) {
          phaseDisplay.innerHTML =
            "⚖️ Phase 3: ชี้ตัวคนร้าย (สรุปคดี)<br><span style='font-size:13px; font-weight:normal;'>ถึงเวลาที่นักสืบจะต้องกดเลือกชื่อเพื่อชี้ตัวฆาตกรตัวจริงแล้ว!</span>";
          nextBtn.classList.add("hidden"); // เฟสสุดท้าย ไม่มีปุ่มไปต่อ
        }
        renderGameUI();
      });

      function renderGameUI() {
        const votingList = document.getElementById("voting-list");

        // ถ้าเป็นเฟส 3 และฉันคือนักสืบ -> ระบบจะเปลี่ยนชื่อทุกคนให้กลายเป็นปุ่มกดโหวตได้
        if (currentPhase === 3 && myRole === "🔵 นักสืบ (Detective)") {
          votingList.innerHTML = currentPlayersInRoom
            .map(
              (p) =>
                `<span class="player-tag clickable" onclick="vote('${p}')">🎯 ชี้ตัวจับกุม ${p}</span>`,
            )
            .join(" ");
        } else {
          // เฟสอื่นๆ หรือเป็นคนธรรมดา เห็นแค่รายชื่อปกติ
          votingList.innerHTML = currentPlayersInRoom
            .map((p) => `<span class="player-tag">👤 ${p}</span>`)
            .join(" ");
        }
      }

      socket.on("announceVote", (msg) => {
        const logs = document.getElementById("logs");
        logs.innerHTML += `<div>${msg}</div>`;
        logs.scrollTop = logs.scrollHeight;
      });
    </script>
  </body>
</html>
